name: Netavark PR 1483 native builds and networking tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-progress main-branch draft release.
concurrency:
  group: netavark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check shell scripts and patch-family input
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/*.sh tests/*.sh; do bash -n "$file"; done
          bash tests/debian-versioning.sh
          for version in 1.14 1.16 1.17 2.0; do
            test -s "patches/$version/0001-allow-published-ports-across-isolated-bridges.patch"
          done
          test ! -e scripts/build-fedora44.sh

  prepare-release:
    needs: [validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create unreviewed draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-release.sh init

  deb:
    name: deb / ${{ matrix.suite }} / ${{ matrix.arch }}
    needs: [validate, prepare-release]
    if: always() && needs.validate.result == 'success' && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    continue-on-error: ${{ matrix.suite == 'experimental' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: trixie, arch: amd64, runner: ubuntu-24.04}
          - {suite: trixie, arch: arm64, runner: ubuntu-24.04-arm}
          - {suite: resolute, arch: amd64, runner: ubuntu-26.04}
          - {suite: resolute, arch: arm64, runner: ubuntu-26.04-arm}
          - {suite: stonking, arch: amd64, runner: ubuntu-26.04}
          - {suite: stonking, arch: arm64, runner: ubuntu-26.04-arm}
          - {suite: forky, arch: amd64, runner: ubuntu-24.04}
          - {suite: forky, arch: arm64, runner: ubuntu-24.04-arm}
          - {suite: sid, arch: amd64, runner: ubuntu-24.04}
          - {suite: sid, arch: arm64, runner: ubuntu-24.04-arm}
          - {suite: experimental, arch: amd64, runner: ubuntu-24.04}
          - {suite: experimental, arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build native deb, test Podman and dual-stack Compose
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE: ${{ matrix.suite }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: bash scripts/ci-deb.sh
      - name: Attach individual uncompressed Debian/Ubuntu package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          # v7 archive:false stores the ORIGINAL single .deb, not a ZIP.
          archive: false
          path: dist/${{ matrix.suite }}/${{ matrix.arch }}/netavark_*_${{ matrix.arch }}.deb
          if-no-files-found: error
          retention-days: 30

  rpm:
    name: rpm / ${{ matrix.platform }} / ${{ matrix.arch }}
    needs: [validate, prepare-release]
    if: always() && needs.validate.result == 'success' && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: fedora43, image: 'fedora:43', arch: x86_64, runner: ubuntu-24.04}
          - {platform: fedora43, image: 'fedora:43', arch: aarch64, runner: ubuntu-24.04-arm}
          - {platform: fedora44, image: 'fedora:44', arch: x86_64, runner: ubuntu-24.04}
          - {platform: fedora44, image: 'fedora:44', arch: aarch64, runner: ubuntu-24.04-arm}
          - {platform: leap16, image: 'opensuse/leap:16.0', arch: x86_64, runner: ubuntu-24.04}
          - {platform: leap16, image: 'opensuse/leap:16.0', arch: aarch64, runner: ubuntu-24.04-arm}
          - {platform: leap161, image: 'opensuse/leap:16.1', arch: x86_64, runner: ubuntu-24.04}
          - {platform: leap161, image: 'opensuse/leap:16.1', arch: aarch64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fedora native SRPM build and tests, or Leap stock test
        env:
          GH_TOKEN: ${{ github.token }}
          RPM_PLATFORM: ${{ matrix.platform }}
          RPM_IMAGE: ${{ matrix.image }}
          RPM_ARCH: ${{ matrix.arch }}
        run: bash scripts/ci-rpm.sh
      - name: Attach individual uncompressed native Fedora RPM
        if: success() && startsWith(matrix.platform, 'fedora')
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/${{ matrix.platform }}/${{ matrix.arch }}/netavark-*.rpm
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Verify individual raw binaries and attach checksums (draft)
    needs: [validate, prepare-release, deb, rpm]
    if: always() && needs.validate.result == 'success' && needs.prepare-release.result == 'success' && needs.deb.result == 'success' && needs.rpm.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify 14 raw binaries and attach SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-release.sh finalize
