name: Native Netavark builds and networking regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel an in-progress main-branch draft release.
concurrency:
  group: netavark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check shell scripts and patch-family input
        shell: bash
        run: |
          set -euo pipefail
          find scripts tests -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          python3 -m py_compile scripts/check-source-version.py
          python3 -m json.tool release/source-versions.json >/dev/null
          test "$(cat release/revision.txt)" -ge 1
          bash tests/debian-versioning.sh
          for version in 1.14 1.16 1.17 2.0; do
            test -s "patches/$version/0001-allow-published-ports-across-isolated-bridges.patch"
          done
          test ! -e scripts/build-fedora44.sh

  deb:
    name: deb / ${{ matrix.os }}-${{ matrix.suite }} / ${{ matrix.arch }}
    needs: [validate]
    if: needs.validate.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    continue-on-error: ${{ matrix.suite == 'experimental' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: trixie, os: debian, arch: amd64, runner: ubuntu-24.04}
          - {suite: trixie, os: debian, arch: arm64, runner: ubuntu-24.04-arm}
          - {suite: resolute, os: ubuntu, arch: amd64, runner: ubuntu-26.04}
          - {suite: resolute, os: ubuntu, arch: arm64, runner: ubuntu-26.04-arm}
          - {suite: stonking, os: ubuntu, arch: amd64, runner: ubuntu-26.04}
          - {suite: stonking, os: ubuntu, arch: arm64, runner: ubuntu-26.04-arm}
          - {suite: forky, os: debian, arch: amd64, runner: ubuntu-24.04}
          - {suite: forky, os: debian, arch: arm64, runner: ubuntu-24.04-arm}
          - {suite: sid, os: debian, arch: amd64, runner: ubuntu-24.04}
          - {suite: sid, os: debian, arch: arm64, runner: ubuntu-24.04-arm}
          - {suite: experimental, os: debian, arch: amd64, runner: ubuntu-24.04}
          - {suite: experimental, os: debian, arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build native deb, test Podman and dual-stack Podman
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE: ${{ matrix.suite }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: bash scripts/ci/deb.sh
      - name: Upload native Debian source package
        if: success() && matrix.arch == 'amd64' && matrix.suite != 'experimental'
        uses: actions/upload-artifact@v7
        with:
          name: source-deb-${{ matrix.suite }}
          path: dist/${{ matrix.suite }}/${{ matrix.arch }}/source/*
          if-no-files-found: error
          retention-days: 30
      - name: Attach individual uncompressed Debian/Ubuntu package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          # v7 archive:false stores the ORIGINAL single .deb, not a ZIP.
          archive: false
          path: dist/${{ matrix.suite }}/${{ matrix.arch }}/netavark_*_${{ matrix.arch }}.deb
          if-no-files-found: error
          retention-days: 30

  rpm:
    name: rpm / ${{ matrix.label }} / ${{ matrix.arch }}
    needs: [validate]
    if: needs.validate.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    # All supported RPM targets must pass their network tests.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: fedora43, label: fedora-43, image: 'fedora:43', arch: x86_64, runner: ubuntu-24.04}
          - {platform: fedora43, label: fedora-43, image: 'fedora:43', arch: aarch64, runner: ubuntu-24.04-arm}
          - {platform: fedora44, label: fedora-44, image: 'fedora:44', arch: x86_64, runner: ubuntu-24.04}
          - {platform: fedora44, label: fedora-44, image: 'fedora:44', arch: aarch64, runner: ubuntu-24.04-arm}
          - {platform: leap16, label: opensuse-leap-16.0, image: 'opensuse/leap:16.0', arch: x86_64, runner: ubuntu-24.04}
          - {platform: leap16, label: opensuse-leap-16.0, image: 'opensuse/leap:16.0', arch: aarch64, runner: ubuntu-24.04-arm}
          - {platform: leap161, label: opensuse-leap-16.1, image: 'opensuse/leap:16.1', arch: x86_64, runner: ubuntu-24.04}
          - {platform: leap161, label: opensuse-leap-16.1, image: 'opensuse/leap:16.1', arch: aarch64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Native Fedora/openSUSE source RPM build and IPv4/IPv6 tests
        env:
          GH_TOKEN: ${{ github.token }}
          RPM_PLATFORM: ${{ matrix.platform }}
          RPM_IMAGE: ${{ matrix.image }}
          RPM_ARCH: ${{ matrix.arch }}
        run: bash scripts/ci/rpm.sh
      - name: Upload patched native Fedora SRPM
        if: success() && startsWith(matrix.platform, 'fedora') && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/${{ matrix.platform }}/${{ matrix.arch }}/source/netavark-*.src.rpm
          if-no-files-found: error
          retention-days: 30
      - name: Upload patched Leap source RPM
        if: success() && startsWith(matrix.platform, 'leap') && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/${{ matrix.platform }}/${{ matrix.arch }}/source/netavark-*.src.rpm
          if-no-files-found: error
      - name: Upload individual patched Leap RPM
        if: success() && startsWith(matrix.platform, 'leap')
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/${{ matrix.platform }}/${{ matrix.arch }}/netavark-[0-9]*.rpm
          if-no-files-found: error
      - name: Attach individual uncompressed native Fedora RPM
        if: success() && startsWith(matrix.platform, 'fedora')
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/${{ matrix.platform }}/${{ matrix.arch }}/netavark-*.rpm
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Assemble validated main-branch assets into draft
    needs: [validate, deb, rpm]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.deb.result == 'success' && needs.rpm.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download binaries and source bundles from this run
        uses: actions/download-artifact@v8
        with:
          path: incoming
      - name: Validate complete candidate and create unpublished draft if new
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/release.sh create incoming
