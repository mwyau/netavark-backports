name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing validated draft release tag
        required: true
        type: string
      confirm:
        description: Type PUBLISH to make the GitHub release public
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: netavark-publication
  cancel-in-progress: false

jobs:
  github-release:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'PUBLISH' && vars.PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: publishing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify approved draft and all release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_TAG" =~ ^netavark-[0-9]{8}\.[1-9][0-9]*$ ]]
          latest="$(gh release list --repo "$GH_REPO" --limit 1000 --json tagName --jq '.[].tagName' |
            grep -E '^netavark-[0-9]{8}\.[1-9][0-9]*$' | head -n1)"
          [[ "$RELEASE_TAG" == "$latest" ]] || {
            echo "Refusing superseded draft $RELEASE_TAG" >&2; exit 1;
          }
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft,isPrerelease \
            --jq 'select(.isDraft == true and .isPrerelease == true)' | grep -q .
          target="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json targetCommitish --jq .targetCommitish)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$target" HEAD
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir incoming
          git show "$target:release/versions.json" > reviewed-versions.json
          python3 scripts/ci/verify-release.py incoming reviewed-versions.json
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --prerelease=false
