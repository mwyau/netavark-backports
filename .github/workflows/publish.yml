name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing validated draft release tag
        required: true
        type: string
      confirm:
        description: Type PUBLISH to make the GitHub release public
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: netavark-publication
  cancel-in-progress: false

jobs:
  github-release:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'PUBLISH' && vars.PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: publishing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify approved draft and all release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/ci/release.py publish "$RELEASE_TAG"
